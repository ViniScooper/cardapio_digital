services:
  # -------------------------------------------------------------
  # Banco de Dados MySQL
  # -------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: boteco_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: viniZIKA3103
      MYSQL_DATABASE: restaurante
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pviniZIKA3103"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # Backend Express (Node.js)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boteco_backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: viniZIKA3103
      DB_NAME: restaurante
      DB_PORT: 3306
      JWT_SECRET: restaurante_jwt_secret_2024
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  # -------------------------------------------------------------
  # Frontend React (Vite + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boteco_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
